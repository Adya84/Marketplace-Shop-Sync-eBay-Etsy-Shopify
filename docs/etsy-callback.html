<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; base-uri 'none'; form-action 'none'">
  <title>Shop Sync â€” Etsy connected</title>
  <style>
    :root { color-scheme: dark; font-family: system-ui, sans-serif; background:#0b1220; color:#ecf4ff }
    body { min-height:100vh; display:grid; place-items:center; margin:0; padding:20px; box-sizing:border-box }
    main { width:min(520px,100%); background:#121d2e; border:1px solid #26364d; border-radius:16px; padding:28px }
    h1 { margin-top:0 } p { color:#a8b8cc; line-height:1.5 }
    button { width:100%; border:0; border-radius:9px; padding:13px; background:#36a3ff; color:#04111e; font-weight:750; cursor:pointer }
    #error { color:#ff91a5 }
  </style>
</head>
<body>
  <main>
    <h1>Shop Sync</h1>
    <div id="success" hidden>
      <h2>Etsy approved</h2>
      <p>Copy the secure authorization result, return to Shop Sync, paste it into <strong>Authorization result</strong>, then select <strong>Finish Etsy connection</strong>.</p>
      <button id="copy">Copy authorization result</button>
      <p id="copied" hidden>Copied. You can now close this tab.</p>
    </div>
    <p id="error" hidden></p>
  </main>
  <script>
    const params = new URLSearchParams(location.search);
    const code = params.get('code');
    const state = params.get('state');
    const error = params.get('error_description') || params.get('error');
    if (error || !code || !state) {
      const box = document.getElementById('error');
      box.textContent = error || 'Etsy did not return a valid authorization result. Return to Shop Sync and try again.';
      box.hidden = false;
    } else {
      const result = btoa(JSON.stringify({code, state})).replace(/=+$/, '').replace(/\+/g, '-').replace(/\//g, '_');
      document.getElementById('success').hidden = false;
      document.getElementById('copy').addEventListener('click', async () => {
        await navigator.clipboard.writeText(result);
        document.getElementById('copied').hidden = false;
      });
    }
  </script>
</body>
</html>
