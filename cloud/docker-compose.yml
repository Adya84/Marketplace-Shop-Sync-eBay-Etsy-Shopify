services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: shopsync
      POSTGRES_USER: shopsync
      POSTGRES_PASSWORD: shopsync
    volumes:
      - shopsync_db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shopsync -d shopsync"]
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    build: .
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8080:8080"

volumes:
  shopsync_db:
